<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E3A8A" />
    <meta name="description" content="Deejota Finanzas: gastos, presupuesto y salud financiera personal." />
    <title>Deejota Finanzas</title>
    <script>
      try {
        var t = localStorage.getItem('dj.tema') || 'sistema';
        var dark = t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
